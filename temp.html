<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= statusCode || 404 %> Error</title>

  <style>
    :root {
      --primary: #2563eb;
      --text: #0f172a;
      --muted: #6b7280;
      --bg: #f9fafb;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wrapper {
      display: flex;
      width: 90%;
      max-width: 1000px;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* LEFT SIDE */
    .left {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .code {
      font-size: 80px;
      font-weight: 800;
      color: var(--primary);
    }

    .title {
      font-size: 26px;
      margin-top: 10px;
      font-weight: 600;
      color: var(--text);
    }

    .desc {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 25px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37,99,235,0.25);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #d1d5db;
      color: var(--text);
    }

    .btn-outline:hover {
      background: #f3f4f6;
    }

    /* RIGHT SIDE */
    .right {
      flex: 1;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
    }

    .illustration {
      text-align: center;
      animation: float 3s ease-in-out infinite;
    }

    .illustration span {
      font-size: 90px;
      display: block;
    }

    .illustration p {
      margin-top: 10px;
      font-size: 18px;
      opacity: 0.9;
    }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .wrapper {
        flex-direction: column;
      }

      .right {
        height: 200px;
      }

      .code {
        font-size: 60px;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>

</head>

<body>

  <div class="wrapper">

```
<!-- LEFT -->
<div class="left">
  <div class="code"><%= statusCode || 404 %></div>

  <div class="title">
    <%= message || "Oops! Page not found" %>
  </div>

  <div class="desc">
    Looks like this route doesn’t exist or your ride took a wrong turn.  
    Don’t worry — let’s get you back on track.
  </div>

  <div class="buttons">
    <button class="btn btn-primary" onclick="goHome()">Go Home</button>
    <button class="btn btn-outline" onclick="goBack()">Go Back</button>
  </div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="illustration">
    <span>🗺️</span>
    <p>Lost Route</p>
  </div>
</div>
```

  </div>

  <script>
    function goHome() {
      window.location.href = "/";
    }

    function goBack() {
      window.history.back();
    }
  </script>

</body>
</html>
